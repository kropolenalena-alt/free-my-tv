name: Build APK

on:
  push:
    branches: [build-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Settings (Saint Petersburg)
        run: |
          cp config.example.properties config.properties
          sed -i \
            -e 's/^tmdb_region=.*/tmdb_region=RU/' \
            -e 's/^latitude=.*/latitude=59.9343/' \
            -e 's/^longitude=.*/longitude=30.3351/' \
            -e 's/^city=.*/city=Санкт-Петербург/' \
            -e 's/^language=.*/language=ru/' \
            -e 's/^temperature=.*/temperature=C/' \
            config.properties
          cat config.properties | grep -v '^#' | grep -v '^$'

      - name: Build
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"
          ./build.sh

      - name: Windows installer kit
        run: |
          mkdir -p kit
          cp FreeMyTV.apk kit/
          cp tools/windows/install.bat kit/
          curl -fsSL -o pt.zip https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          unzip -q pt.zip -d kit

      # The kit goes to its own branch, kit, so it can be fetched with git.
      - name: Publish kit branch
        run: |
          cd kit
          git init -q -b kit
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Free My TV Windows kit (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" kit
